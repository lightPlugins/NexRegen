
enable: true

global-conditions:
  - id: in-world
    world: 'world'
  - id: in-region
    region: 'region'

regen:
  - block: 'minecraft:wheat'
    age: 7
    regen-time: '3-5'
    break-conditions:
      - id: has-age
        age: 7
      - id: has-berries
    settings:
      apply-physics: false
      drop-items: false
      drop-xp: false
    replacement:
      block: 'minecraft:wheat'
      age: 0
